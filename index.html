<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elävä Kauppa – Tämän päivän löydöt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --vihrea:#00774A;
    --koralli:#FBAB97;
    --sammal:#D8E9A2;
    --paperi:#FBF9F4;
    --muste:#1A1A17;
    --koralli-teksti:#C85A3E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  
  html, body{
    width:100%;
    height:100%;
    background:var(--vihrea);
    overflow:hidden;
    font-family:'Manrope',sans-serif;
    color:var(--muste);
  }
  .screen{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- HEADER ---------- */
  header{
    flex:0 0 auto;
    background:var(--vihrea);
    padding:48px 40px;
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .kicker{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:54px;
    font-weight:800;
    color:var(--paperi);
    letter-spacing:-.5px;
    text-align:center;
  }

  /* ---------- SCROLL AREA ---------- */
  .viewport{
    flex:1 1 auto;
    overflow:hidden;
    background:var(--paperi);
    position:relative;
  }
  .viewport::before,.viewport::after{
    content:"";
    position:absolute;left:0;right:0;height:60px;
    z-index:2;pointer-events:none;
  }
  .viewport::before{top:0;background:linear-gradient(var(--paperi),transparent);}
  .viewport::after{bottom:0;background:linear-gradient(transparent,var(--paperi));}

  .track{
    display:flex;
    flex-direction:column;
    width:100%;
    will-change:transform;
    animation:scrollUp linear infinite;
  }
  @keyframes scrollUp{
    from{transform:translateY(0);}
    to{transform:translateY(-50%);}
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px;
    padding:28px 40px 0px 40px;
  }

  .card{
    background:#fff;
    border-radius:22px;
    padding:18px 18px 22px;
    display:flex;flex-direction:column;
    box-shadow:0 6px 18px rgba(26,26,23,.07);
    position:relative;
  }
  .card-cat{
    font-size:15px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--koralli-teksti);
    margin-bottom:10px;
  }
  .card-img-wrap{
    background:var(--paperi);
    border-radius:14px;
    height:280px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    margin-bottom:14px;
  }
  .card-img-wrap img{
    max-width:100%;max-height:100%;
    object-fit:contain;
  }
  .card-name{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.22;
    color:var(--muste);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:54px;
  }
  .price-tag{
    position:absolute;
    top:-10px;right:-10px;
    background:var(--vihrea);
    color:var(--paperi);
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;
    font-size:24px;
    padding:10px 16px 9px;
    border-radius:40px 40px 40px 6px;
    box-shadow:0 4px 10px rgba(26,26,23,.18);
    transform:rotate(4deg);
  }

  /* ---------- FOOTER / CTA ---------- */
  footer{
    flex:0 0 auto;
    background:var(--muste);
    padding:36px 40px;
    display:flex;align-items:center;justify-content:space-between;
    gap:24px;
    position:relative;
    z-index:3;
  }
  .cta-text{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;
    font-size:30px;
    line-height:1.2;
    color:var(--paperi);
  }
  .cta-text span{color:var(--koralli);}
  .cta-url{
    display:block;
    margin-top:8px;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:22px;
    color:var(--sammal);
    letter-spacing:.5px;
  }
  .qr-box{
    flex:0 0 auto;
    background:var(--paperi);
    border-radius:18px;
    padding:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .qr-wrap{
    position:relative;
    width:130px;height:130px;
  }
  .qr-code{display:block;width:130px;height:130px;}
  .qr-logo{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:48px;height:48px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--paperi);
    box-shadow:0 2px 6px rgba(26,26,23,.25);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .qr-logo img{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
  }

  .fallback{
    padding:80px 56px;
    font-size:26px;
    color:var(--muste);
    font-weight:600;
  }
</style>
</head>
<body>
<div class="screen">

  <header>
    <div class="kicker">Päivän poiminnat <span>verkkokaupastamme</span></div>
  </header>

  <div class="viewport">
    <div class="track" id="track">
      <div class="grid" id="grid-a"></div>
      <div class="grid" id="grid-b"></div>
    </div>
  </div>

  <footer>
    <div class="cta-text">
      Nämä ja <span>tuhansia muita aarteita</span>
      <span class="cta-url">elavakauppa.fi</span>
    </div>
    <div class="qr-box">
      <div class="qr-wrap">
        <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&ecc=H&data=https://www.elavakauppa.fi" alt="QR-koodi verkkokauppaan">
        <div class="qr-logo">
          <img src="https://www.elavakauppa.fi/storage/editor_files/Materiaalit2026/Logot/FAVICO.svg" alt="">
        </div>
      </div>
    </div>
  </footer>

</div>

<script>
const FEED_URL = "https://gist.githubusercontent.com/jopezizi/fbc0bdd55aa208a47f6defd9468fca9f/raw/trendit.json";
const SECONDS_PER_ROW = 7.5;      
const RELOAD_MINUTES = 30;        

function formatPrice(p){
  return Number(p).toFixed(0) + " €";
}

function cardHTML(item){
  const img = item.image || "";
  const name = item.name || "";
  const cat = item.category || "";
  const price = item.price != null ? formatPrice(item.price) : "";
  return `
    <div class="card">
      <div class="price-tag">${price}</div>
      <div class="card-cat">${cat}</div>
      <div class="card-img-wrap"><img src="${img}" alt="${name}" loading="lazy"></div>
      <div class="card-name">${name}</div>
    </div>`;
}

async function init(){
  const viewport = document.querySelector('.viewport');
  const track = document.getElementById('track');
  const gridA = document.getElementById('grid-a');
  const gridB = document.getElementById('grid-b');

  try{
    const res = await fetch(FEED_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const items = await res.json();
    if(!Array.isArray(items) || items.length === 0) throw new Error("Tyhjä syöte");

    const html = items.map(cardHTML).join("");
    gridA.innerHTML = html;
    gridB.innerHTML = html; 

    requestAnimationFrame(() => {
      const rows = Math.ceil(items.length / 2);
      const duration = Math.max(rows * SECONDS_PER_ROW, 30);
      track.style.animationDuration = duration + "s";
    });

  }catch(err){
    viewport.innerHTML = `<div class="fallback">Löytöjä ei juuri nyt saatavilla.<br>elavakauppa.fi</div>`;
    console.error("trendit.json-haku epäonnistui:", err);
  }
}

init();
setTimeout(() => location.reload(), RELOAD_MINUTES * 60 * 1000);
</script>
</body>
</html>
